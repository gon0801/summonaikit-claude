# Generado y mantenido por quality-kit (init-repo.ps1) -- QUALITY-KIT MANAGED.
# Si este archivo es EXACTAMENTE igual a lo que init-repo.ps1 generaria hoy
# para el stack detectado, es seguro de volver a generar cada vez que
# corre. Si le agregaste algo propio directo aca (una linea "exclude:", un
# comentario explicandola, un hook nuevo, args editados), init-repo.ps1 lo
# va a detectar y va a dejar el archivo tal cual esta, avisando -- nunca
# se pisa una personalizacion en silencio. Para sumar algo propio de forma
# permanente, agregalo directo en este archivo (no hace falta un archivo
# aparte: pre-commit no fusiona varios archivos de config de todas formas).
#
# Este bloque base (pre-commit-hooks) se incluye SIEMPRE, sin importar el
# stack detectado -- son chequeos genericos de higiene de archivo que
# tienen sentido en cualquier repo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # PERSONALIZACION PROPIA (init-repo.ps1 la detecta y NO la pisa).
      #
      # `tests/golden/baseline.txt` es una GRABACION del comportamiento del
      # hook, no codigo: su whitespace final es FIEL. 23 de sus 31 lineas con
      # espacio al final son `| ` — lineas VACIAS del stdout/stderr del hook,
      # que el arnes muestra con ese prefijo. Recortarlas falsifica la
      # grabacion, y esto no es una hipotesis: la primera corrida de este hook
      # las recorto y el `--check` del arnes paso a marcar DIVERGENCIA en 6
      # escenarios (05, 07, 08, 11, 12, 16).
      #
      # `.gitattributes` ya tiene `tests/golden/** -whitespace`, pero eso solo
      # alcanza a `git diff --check`: pre-commit no lee gitattributes, asi que
      # la exclusion hay que declararla tambien aca.
      - id: trailing-whitespace
        exclude: ^tests/golden/
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml

  # PERSONALIZACION PROPIA (init-repo.ps1 la detecta y NO la pisa).
  #
  # Item "Recommended" de Plans.md: deteccion de secretos antes del commit.
  # tools/check-secrets.sh usa gitleaks si esta instalado (o en
  # $SAIKIT_GITLEAKS) y si no cae a un grep best-effort con los falsos
  # conocidos del repo excluidos; el escaneo fuerte del HISTORIAL lo hace el
  # job `secrets` del CI (.github/workflows/quality.yml).
  - repo: local
    hooks:
      - id: saikit-check-secrets
        name: deteccion de secretos (gitleaks o fallback grep)
        entry: bash tools/check-secrets.sh
        language: system
        types: [text]
      - id: saikit-feature-map-lint
        name: feature-map catalog/descriptors/cards
        entry: python3 .cursor/skills/verify-summonaikit/scripts/lint-feature-map.py
        language: system
        pass_filenames: false
        files: '(\.cursor/skills/verify-summonaikit/|tests/test_feature_map_(inventory|integration)\.sh)'
# >>> QUALITY-KIT REPO-HYGIENE HOOK START -- managed by install-repo-hygiene.ps1
# Candado de capa de contexto: CLAUDE.md raiz <=200 lineas, anidados <=80,
# AGENTS.md <=400, sin diarios '## Estado anterior' (van a docs/).
# Sweep manual de basura: python3 tools/check_context_docs.py . --sweep
  - repo: local
    hooks:
      - id: context-docs-budget
        name: capa de contexto dentro de presupuesto (repo-hygiene)
        entry: python3 tools/check_context_docs.py
        language: system
        pass_filenames: false
        files: '(^|/)(CLAUDE|AGENTS|AGENT)\.md$'
# >>> QUALITY-KIT REPO-HYGIENE HOOK END
