# CI de summonaikit-claude. Corre los mismos candados que ya corren en la
# maquina (pre-commit) mas las pruebas, en la nube, en cada push y en cada pull
# request -- asi el repo queda protegido aunque alguien (el operador, otra IA,
# un colaborador) haga un commit sin pasar por los candados locales, o desde una
# maquina que no los tiene instalados.
#
# ESTE ARCHIVO ES DE ESTE REPO, ya no de la plantilla del quality-kit. Nacio de
# su `init-repo.ps1`, pero el reparto en jobs paralelos de mas abajo (particion
# de la bateria + shards de mutaciones) es propio y no esta en la plantilla.
#
# POR ESO SE LE QUITO, A PROPOSITO, LA LINEA DE ATRIBUCION QUE EL KIT PONE EN LO
# QUE GENERA (la que empieza con "Generado por" y nombra al kit). NO se la
# devuelvas: `Copy-QualityWorkflowIfSafe` (init-repo.ps1, ~linea 778) compara
# contra esa cadena y SOBRESCRIBE con la plantilla generica todo workflow que la
# lleve; el que no la tiene lo respeta ("no lo toco"). Con la marca puesta, la
# proxima corrida de ese script se llevaria por delante el reparto y el CI
# volveria a tardar ~7 min en vez de ~2.3, en silencio y sin aviso.
#
# Verificado 2026-08-29: `init-repo.ps1` es el UNICO script del kit que escribe
# este archivo (`install-ci-linux.ps1` escribe otro, `suite-linux.yml`, con su
# propia marca). Si algun dia el reparto se generaliza, el lugar es la plantilla
# del kit — no volver a marcar este archivo.
name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Run pre-commit (todos los candados locales, sobre todo el repo)
        uses: pre-commit/action@v3.0.1

      - name: Run Python tests
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          pip install pytest
          pytest -q

      - name: Run Node tests
        if: hashFiles('package.json') != ''
        run: npm test --if-present

  # Phase 15 (Task 15.3) — banco del adaptador @summonaikit/dsh-gate. index.js
  # importa @deepseek-ai/schemastery (para Config) y el test del plugin lo usa;
  # se instalan las peer deps (ya son las del propio dsh, no deps nuevas) para
  # que `node --test` resuelva el import.
  node-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install adapter peer deps (schemastery/cordis)
        working-directory: hosts/dsh
        run: npm install --no-save @deepseek-ai/schemastery@3.18.1 @deepseek-ai/cordis@^4.0.1

      - name: Run adapter tests
        working-directory: hosts/dsh
        run: node --test test/

  # Task 10.5 — la suite completa en Linux. En Git Bash/MSYS2 la misma corrida
  # tarda ~18 min porque cada fork del hook cuesta ~28 ms (documentado en
  # AGENTS.md); en Linux el fork es ~0.1 ms, asi que aca la suite entera corre
  # en ~1-2 min y el PR sabe si algo rompio sin esperar la corrida local.
  # SAIKIT_HOOK_VIVO apunta a la FUENTE del repo (leccion de la Task 3.5): sin
  # eso, la suite mediria el hook INSTALADO de la maquina, que en el runner no
  # existe (y cada test saldria `unknown`, que run.sh reporta y NO cuenta como
  # PASS).
  #
  # Salvedad declarada (AGENTS.md, regla 3): la suite ejercita normalizacion de
  # rutas Windows (cd "C:\..." && pwd, contencion A6/3.6). Los casos atados a
  # cygpath ya se autolimitan con `command -v cygpath` y en Linux corren su
  # mitad POSIX; los que dependen de forma Windows de rutas se listan en la
  # fila 10.5 de Plans.md si llegaran a divergir.
  # Reparto en jobs PARALELOS. Nada se saltea: son particiones cuya UNION es la
  # bateria entera, y cada nivel tiene su candado.
  #
  # Medido: el job unico eran 6.9 min (run 33231405475) y `test_gate_mutations`
  # se llevaba ~6 de esos minutos (run 33232669996: la mitad lenta sola tardo
  # 6.0 y la rapida 2.7). Por eso el reparto es en DOS niveles:
  #   1) `SAIKIT_PARTICION` (en `tests/run.sh`) separa la mitad lenta de la
  #      rapida — candado: `tests/test_runner_guards.sh`.
  #   2) `SAIKIT_MUT_SHARD=i/N` (en `tests/test_gate_mutations.sh`) reparte las
  #      111 mutaciones en 3 (37/37/37) — candado:
  #      `tests/test_gate_mutations_guards.sh`.
  #   3) 20.29 — `SAIKIT_SHARD=i/N` (en `tests/run.sh`) reparte los ARCHIVOS de
  #      la mitad rapida en 4 (round-robin, orden LC_ALL=C) — candado:
  #      `tests/test_runner_guards.sh` (union exacta de los shards y esta
  #      matrix completa: N-1 entradas es un archivo que deja de correr).
  # Reloj medido ANTES de 20.29 (2026-09-09, runs 34310637856 y 34311050392):
  # la mitad rapida sola tardaba 22-26 min — 60 archivos en serie, 8x los ~2.7
  # con que se diseno (Phase 19 sumo los test_feature_map_*). Reloj esperado
  # ahora: el archivo mas largo (`test_feature_map_merge`, 376 s), ~6-7 min.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # un shard rojo no debe ocultar el resultado de los otros
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v7

      # 19.12: test_feature_map_secrets_capture.sh (y test_check_secrets.sh)
      # corren en esta mitad rapida. El detector fuerte tiene que estar AQUI,
      # con el mismo tarball/hash que el job `secrets`. Tenerlo solo en el
      # otro job no lo hace disponible en suite.
      - name: Provision pinned gitleaks 8.30.1 (same pin as secrets)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod +x "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Run the gate suite — fast half, shard ${{ matrix.shard }} (tests/run.sh)
        env:
          SAIKIT_HOOK_VIVO: ${{ github.workspace }}/hooks/summonaikit-harness.sh
          SAIKIT_PARTICION: rapidos
          SAIKIT_SHARD: ${{ matrix.shard }}
        run: bash tests/run.sh

  suite-lentos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # un shard rojo no debe ocultar el resultado de los otros
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v7

      - name: Run the gate suite — slow half, shard ${{ matrix.shard }} (tests/run.sh)
        env:
          SAIKIT_HOOK_VIVO: ${{ github.workspace }}/hooks/summonaikit-harness.sh
          SAIKIT_PARTICION: lentos
          SAIKIT_MUT_SHARD: ${{ matrix.shard }}
        run: bash tests/run.sh

  # Compuerta agregada (Greptile, PR #101). El reparto multiplico los checks, y
  # cualquier consumidor que mire UN solo status — una proteccion de rama, el
  # `saikit-merge.sh` de la Phase 18, un humano apurado — veria el `suite` de
  # siempre en verde con `suite-lentos` en rojo: el reparto habria convertido un
  # candado en decoracion. Este job es el unico status que hay que mirar.
  #
  # `if: always()` + comparacion explicita de cada resultado: con `needs:` a
  # secas, un job que falla deja a este SALTEADO, y un check salteado no bloquea
  # nada — seria el mismo verde vacio con otra forma. Los nombres con guion van
  # en corchetes (`needs['node-adapter']`), que es la sintaxis que GitHub acepta.
  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, node-adapter, suite, suite-lentos, secrets]
    steps:
      - name: Todos los jobs de calidad en verde
        env:
          R_QUALITY: ${{ needs.quality.result }}
          R_NODE: ${{ needs['node-adapter'].result }}
          R_SUITE: ${{ needs.suite.result }}
          R_LENTOS: ${{ needs['suite-lentos'].result }}
          R_SECRETS: ${{ needs.secrets.result }}
        run: |
          rc=0
          for par in "quality=$R_QUALITY" "node-adapter=$R_NODE" "suite=$R_SUITE" \
                     "suite-lentos=$R_LENTOS" "secrets=$R_SECRETS"; do
            printf '%s\n' "$par"
            case "$par" in *=success) ;; *) rc=1 ;; esac
          done
          [ "$rc" -eq 0 ] || { echo "gate: algun job de calidad NO quedo en success" >&2; exit 1; }
          echo "gate: OK — todos en success"

  # Item "Recommended" de Plans.md ("CI + pre-commit con deteccion de
  # secretos en este repo"): el hook de este repo corre en CADA turno y nada
  # impedia instalarlo desde una rama con un secreto adentro. Este job es la
  # capa fuerte: gitleaks sobre el HISTORIAL COMPLETO del push (fetch-depth
  # 0), no solo el diff. El binario se descarga a mano en vez de usar
  # gitleaks-action porque esa action exige licencia paga en repos privados.
  #
  # Calibracion medida 2026-08-15 con esta misma version (8.30.1, config
  # default): 0 hallazgos sobre los 179 commits — las credenciales FALSAS de
  # los tests de redaccion (Task 3.5) no matchean sus reglas — y atrapa
  # trampas reales (ghp_/AKIA/sk-proj). La capa local (pre-commit) vive en
  # tools/check-secrets.sh.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # `gitleaks git .` es lectura local: no necesita el token del
          # checkout, y no dejarlo persistido reduce lo que un artefacto
          # externo podria hacer si se lo burlara (hallazgo CR PR #24).
          persist-credentials: false

      - name: gitleaks sobre el historial completo
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # sha256 PINEADO, verificado contra gitleaks_8.30.1_checksums.txt del
          # propio release (hallazgo Greptile P2 / CodeRabbit del PR #24:
          # descargar-y-ejecutar sin verificar deja el historial completo del
          # checkout expuesto a un artefacto sustituido).
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --exit-code 1
