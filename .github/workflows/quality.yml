# Generado por quality-kit (init-repo.ps1). Corre los mismos candados que
# ya corren en tu maquina (pre-commit) mas las pruebas, en la nube, en cada
# push y en cada pull request -- asi el repo queda protegido aunque alguien
# (vos, otra IA, un colaborador) haga un commit sin pasar por los candados
# locales, o desde una maquina que no los tiene instalados.
name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Run pre-commit (todos los candados locales, sobre todo el repo)
        uses: pre-commit/action@v3.0.1

      - name: Run Python tests
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          pip install pytest
          pytest -q

      - name: Run Node tests
        if: hashFiles('package.json') != ''
        run: npm test --if-present

  # Task 10.5 — la suite completa en Linux. En Git Bash/MSYS2 la misma corrida
  # tarda ~18 min porque cada fork del hook cuesta ~28 ms (documentado en
  # AGENTS.md); en Linux el fork es ~0.1 ms, asi que aca la suite entera corre
  # en ~1-2 min y el PR sabe si algo rompio sin esperar la corrida local.
  # SAIKIT_HOOK_VIVO apunta a la FUENTE del repo (leccion de la Task 3.5): sin
  # eso, la suite mediria el hook INSTALADO de la maquina, que en el runner no
  # existe (y cada test saldria `unknown`, que run.sh reporta y NO cuenta como
  # PASS).
  #
  # Salvedad declarada (AGENTS.md, regla 3): la suite ejercita normalizacion de
  # rutas Windows (cd "C:\..." && pwd, contencion A6/3.6). Los casos atados a
  # cygpath ya se autolimitan con `command -v cygpath` y en Linux corren su
  # mitad POSIX; los que dependen de forma Windows de rutas se listan en la
  # fila 10.5 de Plans.md si llegaran a divergir.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run the full gate suite (tests/run.sh)
        env:
          SAIKIT_HOOK_VIVO: ${{ github.workspace }}/hooks/summonaikit-harness.sh
          # Task 10.5: marca los 4 tests Windows-bound como SKIP CON LISTADO
          # (los nombra el runner uno por uno; razones en Plans.md, fila 10.5).
          SAIKIT_CI_LINUX: '1'
        run: bash tests/run.sh

  # Item "Recommended" de Plans.md ("CI + pre-commit con deteccion de
  # secretos en este repo"): el hook de este repo corre en CADA turno y nada
  # impedia instalarlo desde una rama con un secreto adentro. Este job es la
  # capa fuerte: gitleaks sobre el HISTORIAL COMPLETO del push (fetch-depth
  # 0), no solo el diff. El binario se descarga a mano en vez de usar
  # gitleaks-action porque esa action exige licencia paga en repos privados.
  #
  # Calibracion medida 2026-08-15 con esta misma version (8.30.1, config
  # default): 0 hallazgos sobre los 179 commits — las credenciales FALSAS de
  # los tests de redaccion (Task 3.5) no matchean sus reglas — y atrapa
  # trampas reales (ghp_/AKIA/sk-proj). La capa local (pre-commit) vive en
  # tools/check-secrets.sh.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks sobre el historial completo
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # sha256 PINEADO, verificado contra gitleaks_8.30.1_checksums.txt del
          # propio release (hallazgo Greptile P2 / CodeRabbit del PR #24:
          # descargar-y-ejecutar sin verificar deja el historial completo del
          # checkout expuesto a un artefacto sustituido).
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --exit-code 1
